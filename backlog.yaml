- title: Finite Time Blowup for Navier–Stokes
  authors: [OpenAI]
  date: 2026-09-08
  url: https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf
  millennium:
    - problem: navier-stokes
      relation: resolves
  note: >-
    Claims, for every viscosity, a solution that starts from rest under a smooth external force and develops
    unbounded velocity in finite time with bounded energy — the breakdown alternatives (C) and (D).
    A Lean formalization was announced; whether it matches the written proof is disputed, and the Clay
    Institute has not ruled.
  links:
    - label: announcement
      url: https://openai.com/index/navier-stokes-solution/
    - label: Clay statement
      url: https://www.claymath.org/news/navier-stokes-announcement/
    - label: "dispute: Navier–Stokes lost in translation"
      url: https://arxiv.org/abs/2610.08144

- title: "The Quasi-Riemann Hypothesis: a zero-free half-plane"
  authors: [OpenAI]
  date: 2026-09-30
  url: https://github.com/openai/math/blob/main/preprints/The-Quasi-Riemann-Hypothesis-September-30-2026/paper.pdf
  millennium:
    - problem: riemann-hypothesis
      relation: partial
  note: >-
    Claims that every Dirichlet $L$-function, including $\zeta(s)$, has no zeros with $\operatorname{Re}(s) \gt 7/8$
    (openai/math family 003; a companion gives a different proof for $\operatorname{Re}(s) \gt 11/12$).

- title: Exact Birch–Swinnerton-Dyer Formula from Low Selmer Corank
  authors: [OpenAI]
  date: 2026-10-07
  url: https://github.com/openai/math/blob/main/preprints/Exact-Birch-Swinnerton-Dyer-Formula-from-Low-Selmer-Corank-October-7-2026/exact-bsd-low-selmer-corank.pdf
  millennium:
    - problem: birch-swinnerton-dyer
      relation: partial
  note: >-
    Claims the full BSD leading-term formula for every elliptic curve over $\mathbb{Q}$ whose $q$-power Selmer
    group has corank $0$ or $1$ for some prime $q$, including finiteness of the Tate–Shafarevich group
    (openai/math family 002).

