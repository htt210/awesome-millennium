- title: Universal Computation with Eventually Stationary Navier–Stokes Forcing
  authors: [OpenAI]
  date: 2026-09-27
  url: https://github.com/openai/math/blob/main/preprints/Universal-Computation-with-Eventually-Stationary-Navier-Stokes-Forcing-September-27-2026/manuscript.pdf
  millennium:
    - problem: navier-stokes
      relation: adjacent
  note: >-
    Claims viscous incompressible flows, started from rest, that perform universal computation under smooth
    forcing: a marked particle reaches a target region exactly when a given Turing machine halts
    (openai/math family 376).

- title: The Unique Games Theorem
  authors: [OpenAI]
