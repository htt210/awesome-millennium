slug: eth-is-false
title: The Exponential Time Hypothesis is False
short_title: ETH is false
authors: [OpenAI]
date: 2026-10-25          # version explained here ("17 October 2026, revised 25 October 2026")
first_version: 2026-10-17
tldr: >-
  A deterministic algorithm counts the satisfying assignments of any $k$-CNF in subexponential time and
  polynomial space; the case $k = 3$ refutes ETH.
millennium:
  - problem: p-vs-np
    relation: adjacent
    note: >-
      Refutes ETH, SETH, #ETH, Gap-ETH and NSETH. A subexponential running time can still be
      superpolynomial, so P vs NP stays open.
fields: [computational-complexity, algorithms]
tags: [eth, seth, sat, exact-counting, polynomial-method, interpolation, sparsification, circuit-lower-bounds, lean]
status:
  review: preprint
  formalization: complete
  formalization_system: Lean 4
  community: under-examination
  as_of: 2026-10-27
  note: >-
    OpenAI reports a Lean 4 proof of the top-line theorem (with the weaker exponent
    $n(\log\log n)^2/\sqrt{\log n}$), checked against a published statement file. An independent working
    group led by Russell Impagliazzo, Ramamohan Paturi and Ryan Williams is examining the proof.
