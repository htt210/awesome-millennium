slug: o3-sigma-model-continuum-limit
title: The canonical massive continuum limit of the two-dimensional O(3) model
short_title: O(3) continuum limit
authors: [OpenAI]
date: 2026-10-04
first_version: 2026-10-04
tldr: >-
  Claims a rigorous construction of the continuum limit of the two-dimensional lattice $O(3)$ model: an interacting
  relativistic quantum field theory with a unique vacuum and a positive mass gap, the same for every way of removing
  the cutoff.
millennium:
  - problem: yang-mills
    relation: adjacent
    note: >-
      An asymptotically free two-dimensional model with a mass gap, long used as a stand-in for Yang–Mills theory.
      It has no gauge field and lives in two dimensions, so it does not touch the four-dimensional problem.
fields: [mathematical-physics, probability]
tags: [quantum-field-theory, sigma-model, mass-gap, continuum-limit, renormalization-group, osterwalder-schrader]
status:
  review: preprint
  formalization: none
  community: unexamined
  as_of: 2026-11-04
  note: >-
    Released with OpenAI's batch of manuscripts on 6 October 2026 (openai/math family 215). The family's Lean 4
    formalization covers only a companion result, exponential decay of correlations in two-dimensional O(n) models
    for n at least 3; the continuum limit and its mass gap are not formalized. According to search results, a Zenodo
    preprint of 13 October builds on it conditionally. No expert assessment or reported error found.
