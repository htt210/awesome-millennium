slug: unique-games-theorem
title: The Unique Games Theorem
short_title: Unique Games Theorem
authors: [OpenAI]
date: 2026-09-23
first_version: 2026-09-23
tldr: >-
  Claims a proof of Khot's Unique Games Conjecture, which would make the best known approximation algorithms for
  Max-Cut, Vertex Cover and many other problems provably optimal unless P = NP.
millennium:
  - problem: p-vs-np
    relation: adjacent
    note: >-
      Does not decide whether P equals NP. It shows that many approximation problems are exactly as hard as NP
      problems, so their best known algorithms cannot be improved unless P = NP.
fields: [computational-complexity, theoretical-computer-science]
tags: [unique-games-conjecture, hardness-of-approximation, pcp, max-cut, vertex-cover, grassmann-graphs, lean]
status:
  review: preprint
  formalization: complete
  formalization_system: Lean 4
  community: under-examination
  as_of: 2026-11-04
  note: >-
    Dated 23 September 2026 and released with OpenAI's batch of manuscripts on 6 October. OpenAI published Lean 4
    formalizations of the main reduction and of the direct Max-Cut, Vertex Cover, Min-UnCut and directed feedback
    vertex set hardness results (we have not re-run them). Press and blog coverage in October reports that experts
    including Dana Moshkovitz, Subhash Khot, Johan Håstad and Dor Minzer were studying the proof, without a
    settled verdict; we could not open those sources directly. No error has been reported to our knowledge.
