slug: navier-stokes-blowup
title: Finite Time Blowup for Navier–Stokes
short_title: Navier–Stokes blowup
authors: [OpenAI]
date: 2026-09-08
tldr: >-
  For every viscosity, a smooth force that is switched on for a while drives a fluid starting at rest to
  unbounded speed at time 1 with bounded energy, which would settle the Clay problem through its breakdown
  alternatives (C) and (D).
millennium:
  - problem: navier-stokes
    relation: resolves
    note: >-
      Claims breakdown alternatives (C) and (D) of the official problem, which allow a smooth, decaying force.
      Whether flows with no force can break down stays open. The Clay Institute has not ruled.
fields: [partial-differential-equations, fluid-dynamics]
tags: [navier-stokes, blowup, singularity, forcing, self-similar, convex-integration, weak-strong-uniqueness, lean]
status:
  review: preprint
  formalization: complete
  formalization_system: Lean 4
  community: under-examination
  as_of: 2026-11-02
  note: >-
    OpenAI published a Lean 4 formalization (about 429,000 lines) of both breakdown statements, checked against
    an adaptation of the Formal Conjectures statement of the problem; we have not re-run it. Bastounis,
    Circelli and Hansen (arXiv 2610.08144, 6 October 2026) show that parts of the Lean proof follow different
    arguments, and sometimes prove different intermediate bounds, from the written paper; they make no claim
    that the written proof is wrong. The Clay Institute says it is evaluating the claim. This explainer was
    checked against the paper's Sections 1-3 (introduction, physical description, proof outline).
