slug: depth-three-circuits-beyond-square-root
title: Beyond the Square-Root Exponent for Depth-Three Boolean Circuits
short_title: Depth-three circuits beyond the square root
authors: [OpenAI]
date: 2026-09-23
first_version: 2026-09-23
tldr: >-
  Claims one explicit polynomial-time function whose three-layer OR–AND–OR circuits need $2^{\omega(\sqrt n)}$
  gates, past the square-root exponent that explicit depth-three lower bounds had not beaten since the 1980s.
millennium:
  - problem: p-vs-np
    relation: adjacent
    note: >-
      A circuit lower bound for a weak model, three-layer circuits, for a function that is easy for ordinary
      programs. It does not decide P vs NP and is far from the bounds that would affect general circuits.
fields: [computational-complexity, theoretical-computer-science]
tags: [circuit-lower-bounds, depth-three-circuits, random-restrictions, sparsification, lean]
